<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Мой Диск</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
      }
      body {
        background: #ffffff;
        color: #000;
        height: 100vh;
        overflow: hidden;
      }

      /* Экран входа */
      #auth-screen {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f9f9f9;
      }
      .login-box {
        width: 100%;
        max-width: 380px;
        padding: 40px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .login-box h1 {
        margin-bottom: 24px;
        font-size: 22px;
        font-weight: bold;
      }
      .input-group {
        position: relative;
        margin-bottom: 16px;
      }
      .input-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }
      .input-group input:focus {
        border-color: #fc0;
      }
      .toggle-password {
        position: absolute;
        right: 12px;
        top: 14px;
        cursor: pointer;
        color: #999;
        width: 20px;
        height: 20px;
      }
      .toggle-password svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }
      .btn-yellow {
        width: 100%;
        padding: 12px;
        background: #ffdb4d;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
        transition: 0.2s;
      }
      .btn-yellow:hover {
        background: #ffcc00;
      }
      .error {
        color: #d93025;
        font-size: 13px;
        margin-top: 12px;
      }
      .switch-link {
        display: block;
        margin-top: 20px;
        font-size: 14px;
        color: #007bff;
        cursor: pointer;
      }

      /* Экран диска */
      .hidden {
        display: none !important;
      }
      #disk-screen {
        display: flex;
        height: 100vh;
      }

      /* Левая панель */
      .sidebar {
        width: 260px;
        background: #f7f7f7;
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #eaeaea;
        overflow-y: auto;
      }
      .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-left: 12px;
        margin-bottom: 24px;
      }
      .logo {
        font-size: 22px;
        font-weight: bold;
      }
      .search-btn {
        background: none;
        border: none;
        cursor: pointer;
        width: 24px;
        height: 24px;
      }
      .search-btn svg {
        width: 100%;
        height: 100%;
        fill: #333;
      }

      .btn-sidebar {
        width: 100%;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-upload-main {
        background: #ffdb4d;
        color: #000;
      }
      .btn-create-folder {
        background: #e6e6e6;
        color: #000;
      }
      .btn-sidebar svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      /* Меню */
      .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 16px;
        margin-bottom: 20px;
      }
      .nav-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        background: transparent;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        color: #000;
        text-align: left;
        transition: 0.2s;
        width: 100%;
      }
      .nav-btn svg {
        width: 20px;
        height: 20px;
        fill: #444;
        flex-shrink: 0;
      }
      .nav-btn:hover {
        background: #ebebeb;
      }
      .nav-btn.active {
        background: #e6e6e6;
        font-weight: 500;
      }
      .nav-btn.active svg {
        fill: #000;
      }

      .family-btn {
        justify-content: space-between;
      }
      .family-btn .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .plus-icon {
        background: #e0e0e0;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #555;
      }

      /* Блок памяти */
      .storage-info {
        margin-top: auto;
        padding: 15px;
        background: transparent;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .storage-text-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
      }
      .storage-bar {
        height: 4px;
        background: #e0e0e0;
        border-radius: 2px;
        overflow: hidden;
      }
      .storage-fill {
        height: 100%;
        background: #ffdb4d;
        width: 0%;
        transition: width 0.3s;
      }

      /* Профиль */
      .user-profile {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-top: 1px solid #eaeaea;
      }
      .user-avatar {
        width: 32px;
        height: 32px;
        background: #ffdb4d;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #000;
        font-size: 15px;
      }
      .user-info {
        flex: 1;
        overflow: hidden;
      }
      .user-email {
        font-size: 13px;
        font-weight: bold;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 2px;
      }
      .btn-logout {
        padding: 0;
        background: transparent;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 12px;
        text-align: left;
      }

      /* Главная область */
      .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .top-bar {
        padding: 24px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .nav-zone {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .back-btn {
        background: none;
        border: none;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        transition: 0.2s;
      }
      .back-btn:hover {
        background: #f0f0f0;
      }
      .back-btn svg {
        width: 24px;
        height: 24px;
        fill: #333;
      }

      .breadcrumbs {
        font-size: 24px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .breadcrumb-item {
        cursor: pointer;
        color: #000;
      }
      .breadcrumb-sep {
        color: #ccc;
        font-size: 20px;
      }

      .upload-controls {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .file-name-display {
        color: #666;
        font-size: 13px;
        max-width: 150px;
        overflow: hidden;
        white-space: nowrap;
      }

      /* Сетка файлов */
      .files-container {
        flex: 1;
        padding: 10px 40px;
        overflow-y: auto;
      }
      .files-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 20px;
      }
      .grid-item {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 10px;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s;
      }
      .grid-item:hover {
        background: #f4f4f4;
      }

      .delete-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #ffe5e5;
        border: none;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .delete-btn:hover {
        background: #ffcccc;
      }
      .delete-btn svg {
        width: 16px;
        height: 16px;
        fill: #d93025;
      }
      .grid-item:hover .delete-btn {
        display: flex;
      }

      .grid-icon {
        width: 72px;
        height: 72px;
        margin-bottom: 12px;
      }
      .folder-icon svg {
        fill: #ffdb4d;
      }
      .file-icon svg {
        fill: #c4c4c4;
      }
      .grid-name {
        font-size: 14px;
        text-align: center;
        word-break: break-word;
      }

      /* Красивые заглушки для разделов */
      .placeholder-view {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 60vh;
        color: #888;
        text-align: center;
      }
      .placeholder-view svg {
        width: 80px;
        height: 80px;
        fill: #ddd;
        margin-bottom: 20px;
      }
      .placeholder-view h2 {
        color: #333;
        margin-bottom: 10px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen">
      <div class="login-box">
        <h1 id="auth-title">Вход в Мой Диск</h1>
        <div class="input-group">
          <input type="email" id="email" placeholder="Введите email" />
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="Введите пароль" />
          <span class="toggle-password" onclick="togglePassword()"
            ><svg id="eye-icon" viewBox="0 0 24 24">
              <path
                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
              /></svg
          ></span>
        </div>
        <div class="input-group hidden" id="confirm-password-group">
          <input
            type="password"
            id="confirm-password"
            placeholder="Повторите пароль"
          />
        </div>
        <button class="btn-yellow" id="auth-btn" onclick="handleAuth()">
          Авторизоваться
        </button>
        <p id="auth-msg" class="error"></p>
        <a class="switch-link" id="switch-mode" onclick="toggleMode()"
          >Нет аккаунта? Зарегистрироваться</a
        >
      </div>
    </div>

    <!-- ЭКРАН ДИСКА -->
    <div id="disk-screen" class="hidden">
      <!-- Левая панель -->
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="logo">Диск</div>
          <button class="search-btn" onclick="searchFiles()">
            <svg viewBox="0 0 24 24">
              <path
                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              />
            </svg>
          </button>
        </div>

        <input
          type="file"
          id="file-input"
          style="display: none"
          onchange="
            document.getElementById('file-name-display').innerText = this
              .files[0]
              ? this.files[0].name
              : 'Файл не выбран'
          "
        />
        <button
          class="btn-sidebar btn-upload-main"
          onclick="document.getElementById('file-input').click()"
        >
          <svg viewBox="0 0 24 24">
            <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" /></svg
          >Загрузить
        </button>
        <button class="btn-sidebar btn-create-folder" onclick="createFolder()">
          <svg viewBox="0 0 24 24">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" /></svg
          >Создать
        </button>

        <div class="nav-menu">
          <button id="nav-recent" class="nav-btn" onclick="switchTab('recent')">
            <svg viewBox="0 0 24 24">
              <path
                d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"
              /></svg
            >Последние
          </button>

          <button id="nav-my" class="nav-btn active" onclick="switchTab('my')">
            <svg viewBox="0 0 24 24">
              <path
                d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"
              /></svg
            >Файлы
          </button>

          <button id="nav-photos" class="nav-btn" onclick="switchTab('photos')">
            <svg viewBox="0 0 24 24">
              <path
                d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"
              /></svg
            >Фото
          </button>

          <button id="nav-albums" class="nav-btn" onclick="switchTab('albums')">
            <svg viewBox="0 0 24 24">
              <path
                d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"
              /></svg
            >Альбомы
          </button>

          <button id="nav-shared" class="nav-btn" onclick="switchTab('shared')">
            <svg viewBox="0 0 24 24">
              <path
                d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
              /></svg
            >Общий доступ
          </button>

          <button
            id="nav-family"
            class="nav-btn family-btn"
            onclick="switchTab('family')"
          >
            <div class="left">
              <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg
              >Семья
            </div>
            <div class="plus-icon">+</div>
          </button>

          <button
            id="nav-downloads"
            class="nav-btn"
            onclick="switchTab('downloads')"
          >
            <svg viewBox="0 0 24 24">
              <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" /></svg
            >Загрузки
          </button>

          <button id="nav-trash" class="nav-btn" onclick="switchTab('trash')">
            <svg viewBox="0 0 24 24">
              <path
                d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"
              /></svg
            >Корзина
          </button>

          <button
            id="nav-history"
            class="nav-btn"
            onclick="switchTab('history')"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"
              /></svg
            >История
          </button>

          <button
            id="nav-storage"
            class="nav-btn"
            onclick="switchTab('storage')"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"
              /></svg
            >Управление местом
          </button>
        </div>

        <div class="storage-info">
          <div class="storage-text-row">
            <span>Занято</span>
            <span id="storage-text">0 МБ из 1 ГБ</span>
          </div>
          <div class="storage-bar">
            <div class="storage-fill" id="storage-fill"></div>
          </div>
        </div>

        <div class="user-profile">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-info">
            <div class="user-email" id="user-email">Загрузка...</div>
            <button class="btn-logout" onclick="logout()">Выйти</button>
          </div>
        </div>
      </div>

      <!-- Основная зона -->
      <div class="main-area">
        <div class="top-bar">
          <div class="nav-zone">
            <button id="back-btn" class="back-btn" onclick="goBack()">
              <svg viewBox="0 0 24 24">
                <path
                  d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
                />
              </svg>
            </button>
            <div class="breadcrumbs" id="breadcrumbs"></div>
          </div>
          <div class="upload-controls">
            <span id="file-name-display" class="file-name-display"
              >Файл не выбран</span
            >
            <button
              class="btn-yellow"
              style="width: auto; padding: 8px 20px; margin: 0"
              onclick="uploadFile()"
            >
              Загрузить файл
            </button>
            <span id="status" style="font-size: 13px; font-weight: bold"></span>
          </div>
        </div>
        <div class="files-container" id="files-container">
          <div id="file-list" class="files-grid"></div>
        </div>
      </div>
    </div>

    <script>
      // ==========================================
      // ВСТАВЬ СЮДА СВОИ КЛЮЧИ ИЗ SUPABASE!
      // ==========================================
      const SUPABASE_URL = "https://jjjruysmbldsgclotcbd.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqanJ1eXNtYmxkc2djbG90Y2JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDA0NzksImV4cCI6MjEwNzk3NjQ3OX0.FFct-z_7ledyf3IwtDUjB-hIbvE9MN2zhuTJfmU8BIU";

      const supabaseClient = supabase.createClient(

      );
      let currentUser = null;
      let isLoginMode = true;
      let currentFolder = "my"; // Текущий раздел
      let currentPath = ""; // Вложенность папок
      let allFilesData = []; // Кэш всех файлов для быстрой фильтрации

      const eyeOpen =
        '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
      const eyeClosed =
        '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
      const deleteIcon =
        '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';

      function translateError(msg) {
        if (msg.includes("row-level security policy"))
          return "Нет прав. Проверьте правила в базе.";
        if (msg.includes("Invalid key")) return "Недопустимое имя файла.";
        return msg;
      }

      // Шифрование
      function encodeName(str) {
        const b = new TextEncoder().encode(str);
        return btoa(Array.from(b, (x) => String.fromCodePoint(x)).join(""))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, ".");
      }
      function decodeName(str) {
        try {
          const b = atob(
            str.replace(/-/g, "+").replace(/_/g, "/").replace(/\./g, "="),
          );
          const u = Uint8Array.from(b, (m) => m.codePointAt(0));
          return new TextDecoder().decode(u);
        } catch (e) {
          return str;
        }
      }
      function encodeFile(f) {
        const p = f.split(".");
        if (p.length > 1) {
          const e = p.pop();
          return encodeName(p.join(".")) + "." + e;
        }
        return encodeName(f);
      }
      function decodeFile(f) {
        const p = f.split(".");
        if (p.length > 1) {
          const e = p.pop();
          return decodeName(p.join(".")) + "." + e;
        }
        return decodeName(f);
      }

      function togglePassword() {
        const p = document.getElementById("password");
        const icon = document.getElementById("eye-icon");
        if (p.type === "password") {
          p.type = "text";
          icon.innerHTML = eyeClosed;
        } else {
          p.type = "password";
          icon.innerHTML = eyeOpen;
        }
      }

      function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById("auth-title").textContent = isLoginMode
          ? "Вход в Мой Диск"
          : "Регистрация";
        document.getElementById("auth-btn").textContent = isLoginMode
          ? "Авторизоваться"
          : "Создать аккаунт";
        document.getElementById("switch-mode").textContent = isLoginMode
          ? "Нет аккаунта? Зарегистрироваться"
          : "Уже есть аккаунт? Войти";
        document.getElementById("auth-msg").textContent = "";
        document
          .getElementById("confirm-password-group")
          .classList.toggle("hidden", isLoginMode);
      }

      async function handleAuth() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const msgEl = document.getElementById("auth-msg");
        msgEl.textContent = "";

        if (!email || !password) {
          msgEl.textContent = "Заполните все поля!";
          return;
        }

        if (isLoginMode) {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password,
          });
          if (error) msgEl.textContent = "Неверный email или пароль";
          else {
            currentUser = data.user;
            showDisk();
          }
        } else {
          if (password !== document.getElementById("confirm-password").value) {
            msgEl.textContent = "Пароли не совпадают!";
            return;
          }
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
          });
          if (error)
            msgEl.textContent = "Ошибка: " + translateError(error.message);
          else {
            const { data: loginData } =
              await supabaseClient.auth.signInWithPassword({ email, password });
            if (loginData.user) {
              currentUser = loginData.user;
              showDisk();
            }
          }
        }
      }

      async function logout() {
        await supabaseClient.auth.signOut();
        currentUser = null;
        currentPath = "";
        document.getElementById("auth-screen").classList.remove("hidden");
        document.getElementById("disk-screen").classList.add("hidden");
      }

      function showDisk() {
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("disk-screen").classList.remove("hidden");
        document.getElementById("user-email").innerText = currentUser.email;
        document.getElementById("user-avatar").innerText =
          currentUser.email[0].toUpperCase();
        switchTab("my");
      }

      // Переключение разделов
      function switchTab(tab) {
        currentFolder = tab;
        currentPath = "";

        // Подсветка меню
        document
          .querySelectorAll(".nav-btn")
          .forEach((btn) => btn.classList.remove("active"));
        if (document.getElementById("nav-" + tab))
          document.getElementById("nav-" + tab).classList.add("active");

        updateBreadcrumbs();
        loadFiles();
      }

      function updateBreadcrumbs() {
        const bc = document.getElementById("breadcrumbs");
        bc.innerHTML = "";

        const backBtn = document.getElementById("back-btn");
        if (currentPath) {
          backBtn.style.display = "flex";
        } else {
          backBtn.style.display = "none";
        }

        const titles = {
          my: "Файлы",
          recent: "Последние",
          photos: "Фото",
          albums: "Альбомы",
          shared: "Общий доступ",
          family: "Семья",
          downloads: "Загрузки",
          trash: "Корзина",
          history: "История",
          storage: "Управление местом",
        };

        const rootLink = document.createElement("span");
        rootLink.className = "breadcrumb-item";
        rootLink.textContent = titles[currentFolder] || "Файлы";
        rootLink.onclick = () => {
          currentPath = "";
          updateBreadcrumbs();
          loadFiles();
        };
        bc.appendChild(rootLink);

        if (currentPath) {
          const sep = document.createElement("span");
          sep.className = "breadcrumb-sep";
          sep.innerHTML = "&rsaquo;";
          bc.appendChild(sep);
          const curr = document.createElement("span");
          curr.textContent = decodeName(currentPath.split("/").pop());
          bc.appendChild(curr);
        }
      }

      function goBack() {
        if (!currentPath) return;
        const parts = currentPath.split("/");
        parts.pop();
        currentPath = parts.join("/");
        updateBreadcrumbs();
        loadFiles();
      }

      // Создание папок
      async function createFolder() {
        const folderName = prompt("Название папки:");
        if (!folderName || folderName.trim() === "") return;

        const statusEl = document.getElementById("status");
        statusEl.style.color = "#007bff";
        statusEl.textContent = "Создание...";

        const safeName = encodeName(folderName.trim());
        const basePath = currentFolder === "shared" ? "shared" : currentUser.id;
        const fullPath = currentPath
          ? `${basePath}/${currentPath}/${safeName}`
          : `${basePath}/${safeName}`;

        const { error } = await supabaseClient.storage
          .from("disk")
          .upload(`${fullPath}/.emptyFolderPlaceholder`, new Blob([""]), {
            upsert: true,
          });

        if (error) {
          statusEl.style.color = "#d93025";
          statusEl.textContent = "Ошибка: " + translateError(error.message);
        } else {
          statusEl.style.color = "#008000";
          statusEl.textContent = "Папка создана!";
          loadFiles();
          setTimeout(() => (statusEl.textContent = ""), 3000);
        }
      }

      async function deleteItem(itemPath, isFolder) {
        if (!confirm("Удалить навсегда?")) return;
        const pathsToRemove = isFolder
          ? [`${itemPath}/.emptyFolderPlaceholder`]
          : [itemPath];
        const { error } = await supabaseClient.storage
          .from("disk")
          .remove(pathsToRemove);
        if (error)
          alert(
            "Нельзя удалить папку с файлами! Сначала удалите файлы из неё.",
          );
        else loadFiles();
      }

      // Загрузка и фильтрация файлов
      async function loadFiles() {
        const fileListEl = document.getElementById("file-list");
        fileListEl.innerHTML = '<p style="color:#888;">Загрузка...</p>';

        // Заглушки для разделов, которых нет в базе (они чисто визуальные)
        if (["family", "trash", "history"].includes(currentFolder)) {
          let msg =
            currentFolder === "trash"
              ? "Корзина пуста"
              : currentFolder === "history"
                ? "История действий пуста"
                : "Пригласите близких";
          let icon =
            currentFolder === "trash"
              ? deleteIcon
              : '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';
          fileListEl.innerHTML = `<div style="grid-column: 1 / -1;" class="placeholder-view">${icon}<h2>${msg}</h2><p>Здесь пока ничего нет.</p></div>`;
          updateStorageUI(0);
          return;
        }

        // Получаем данные из Supabase
        const basePath = currentFolder === "shared" ? "shared" : currentUser.id;
        const fullPath = currentPath ? `${basePath}/${currentPath}` : basePath;
        const { data, error } = await supabaseClient.storage
          .from("disk")
          .list(fullPath);

        if (error) {
          fileListEl.innerHTML =
            '<p class="error">Ошибка: ' +
            translateError(error.message) +
            "</p>";
          return;
        }
        fileListEl.innerHTML = "";

        let folders = data.filter(
          (f) => f.id === null && f.name !== ".emptyFolderPlaceholder",
        );
        let files = data.filter(
          (f) => f.id !== null && f.name !== ".emptyFolderPlaceholder",
        );

        // Логика фильтров для разных разделов
        if (currentFolder === "photos") {
          folders = []; // В фото только файлы
          files = files.filter((f) =>
            f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i),
          );
        } else if (currentFolder === "albums") {
          files = []; // В альбомах только папки
        } else if (
          currentFolder === "recent" ||
          currentFolder === "downloads"
        ) {
          // Просто показываем все файлы (в реальности сортировали бы по дате)
        }

        if (currentFolder === "storage") {
          // Красивая статистика для раздела "Управление местом"
          let photoSize = 0,
            videoSize = 0,
            docSize = 0;
          files.forEach((f) => {
            if (f.name.match(/\.(jpg|jpeg|png|gif)$/i))
              photoSize += f.metadata.size;
            else if (f.name.match(/\.(mp4|mov|avi)$/i))
              videoSize += f.metadata.size;
            else docSize += f.metadata.size;
          });
          fileListEl.innerHTML = `
                <div style="grid-column: 1 / -1; padding: 20px; background: #fff; border-radius: 12px; border: 1px solid #eaeaea; width: 100%; max-width: 600px;">
                    <h2 style="margin-bottom: 20px; color:#333;">Хранилище</h2>
                    <div style="margin-bottom: 15px;">
                        <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px;"><span>🖼️ Фото</span> <span>${(photoSize / 1024 / 1024).toFixed(1)} МБ</span></div>
                        <div class="storage-bar" style="height:8px;"><div class="storage-fill" style="width: ${Math.min((photoSize / 1024 / 1024 / 1000) * 100, 100)}%; background:#007bff;"></div></div>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px;"><span>🎬 Видео</span> <span>${(videoSize / 1024 / 1024).toFixed(1)} МБ</span></div>
                        <div class="storage-bar" style="height:8px;"><div class="storage-fill" style="width: ${Math.min((videoSize / 1024 / 1024 / 1000) * 100, 100)}%; background:#d93025;"></div></div>
                    </div>
                    <div>
                        <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px;"><span>📄 Документы</span> <span>${(docSize / 1024 / 1024).toFixed(1)} МБ</span></div>
                        <div class="storage-bar" style="height:8px;"><div class="storage-fill" style="width: ${Math.min((docSize / 1024 / 1024 / 1000) * 100, 100)}%; background:#888;"></div></div>
                    </div>
                </div>
            `;
          updateStorageUI(photoSize + videoSize + docSize);
          return;
        }

        // Подсчет памяти
        let totalBytes = 0;
        files.forEach((f) => {
          totalBytes += f.metadata.size;
        });
        updateStorageUI(totalBytes);

        if (folders.length === 0 && files.length === 0) {
          fileListEl.innerHTML = `<div style="grid-column: 1 / -1;" class="placeholder-view"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg><h2>Здесь пока пусто</h2><p>Загрузите файл или создайте папку.</p></div>`;
          return;
        }

        // Отрисовка
        folders.forEach((folder) => {
          const div = document.createElement("div");
          div.className = "grid-item";
          const currentFolderPath = currentPath
            ? `${currentPath}/${folder.name}`
            : folder.name;
          const fullItemPath = `${basePath}/${currentFolderPath}`;
          div.onclick = () => {
            currentPath = currentFolderPath;
            updateBreadcrumbs();
            loadFiles();
          };
          div.innerHTML = `
                <button class="delete-btn" onclick="event.stopPropagation(); deleteItem('${fullItemPath}', true)">${deleteIcon}</button>
                <div class="grid-icon folder-icon"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></div>
                <span class="grid-name">${decodeName(folder.name)}</span>
            `;
          fileListEl.appendChild(div);
        });

        files.forEach((file) => {
          const div = document.createElement("div");
          div.className = "grid-item";
          const { data: urlData } = supabaseClient.storage
            .from("disk")
            .getPublicUrl(`${fullPath}/${file.name}`);
          const fullItemPath = `${fullPath}/${file.name}`;

          let iconSvg =
            '<path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/>';
          if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i))
            iconSvg =
              '<path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>';
          if (file.name.match(/\.(mp4|mov|avi|mkv)$/i))
            iconSvg =
              '<path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>';

          div.innerHTML = `
                <button class="delete-btn" onclick="event.stopPropagation(); deleteItem('${fullItemPath}', false)">${deleteIcon}</button>
                <div class="grid-icon file-icon"><svg viewBox="0 0 24 24">${iconSvg}</svg></div>
                <span class="grid-name">${decodeFile(file.name)}</span>
            `;
          div.onclick = () => window.open(urlData.publicUrl, "_blank");
          fileListEl.appendChild(div);
        });
      }

      function updateStorageUI(totalBytes) {
        const mbSize = (totalBytes / (1024 * 1024)).toFixed(1);
        document.getElementById("storage-text").innerText =
          `${mbSize} МБ из 1 ГБ`;
        document.getElementById("storage-fill").style.width =
          Math.min((mbSize / 1000) * 100, 100) + "%";
      }

      // Поиск (Лупа)
      function searchFiles() {
        const query = prompt("Что ищем?");
        if (!query) return;
        const fileListEl = document.getElementById("file-list");
        fileListEl.innerHTML = `<div style="grid-column: 1 / -1; margin-bottom: 20px;"><b>Результаты поиска по запросу: "${query}"</b></div>`;

        // Очень простой поиск по текущей папке
        const basePath = currentFolder === "shared" ? "shared" : currentUser.id;
        supabaseClient.storage
          .from("disk")
          .list(basePath)
          .then(({ data }) => {
            const found = data.filter((f) =>
              decodeFile(f.name).toLowerCase().includes(query.toLowerCase()),
            );
            if (found.length === 0) {
              fileListEl.innerHTML += `<div style="grid-column: 1 / -1;" class="placeholder-view"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><h2>Ничего не найдено</h2></div>`;
              return;
            }
            found.forEach((file) => {
              const div = document.createElement("div");
              div.className = "grid-item";
              const { data: urlData } = supabaseClient.storage
                .from("disk")
                .getPublicUrl(`${basePath}/${file.name}`);
              div.innerHTML = `
                    <div class="grid-icon file-icon"><svg viewBox="0 0 24 24"><path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg></div>
                    <span class="grid-name">${decodeFile(file.name)}</span>
                `;
              div.onclick = () => window.open(urlData.publicUrl, "_blank");
              fileListEl.appendChild(div);
            });
          });
      }

      async function uploadFile() {
        const fileInput = document.getElementById("file-input");
        const statusEl = document.getElementById("status");
        if (!fileInput.files || fileInput.files.length === 0) {
          statusEl.style.color = "#d93025";
          statusEl.textContent = "Выберите файл!";
          return;
        }
        const file = fileInput.files[0];
        statusEl.style.color = "#007bff";
        statusEl.textContent = "Загрузка...";

        const safeFileName = encodeFile(file.name);
        const basePath = currentFolder === "shared" ? "shared" : currentUser.id;
        const fullPath = currentPath ? `${basePath}/${currentPath}` : basePath;

        const { error } = await supabaseClient.storage
          .from("disk")
          .upload(`${fullPath}/${safeFileName}`, file, { upsert: true });

        if (!error) {
          statusEl.style.color = "#008000";
          statusEl.textContent = "Загружено!";
          fileInput.value = "";
          document.getElementById("file-name-display").innerText =
            "Файл не выбран";
          loadFiles();
          setTimeout(() => (statusEl.textContent = ""), 3000);
        } else {
          statusEl.style.color = "#d93025";
          statusEl.textContent = "Ошибка: " + translateError(error.message);
        }
      }

      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) {
          currentUser = session.user;
          showDisk();
        }
      });
    </script>
  </body>
</html>
